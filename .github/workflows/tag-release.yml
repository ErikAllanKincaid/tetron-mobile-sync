name: Tag release build

# Runs the same gate this repo's own reconcile.py enforces locally (spec
# diff, cargo build/clippy/test/audit), then cross-compiles the crate for
# Android, regenerates the UniFFI Kotlin bindings, builds the debug APK,
# and attaches it to a GitHub Release for the tag. Mirrors tetron-mobile's
# own tag-release.yml (same reasoning throughout); the two differences are
# this repo's own reconcile.py needing `uv` (tetron-mobile's does not), and
# no cross-repo mirror to tetron core's release page (a separate product
# decision, left out for now -- easy to add later the same way
# tetron-mobile's CORE_RELEASE_TOKEN step does).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # secrets.* isn't allowed inside step `if:` conditions -- mirror it
      # into env so the keystore-decode step's own `if:` can check whether
      # it's set up yet. Skips quietly (falls back to AGP's own ephemeral
      # debug key) rather than failing the run if these secrets are
      # missing, same precedent as tetron-mobile's own workflow.
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Show disk usage (before build)
        run: df -h

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit and cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-ndk

      # This repo's reconcile.py runs `uv run libspec diff` (spec-first
      # workflow) ahead of the cargo checks -- tetron-mobile's own
      # reconcile.py has no spec/ tree at all, so its workflow never
      # needed this step.
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # Same gate as running this locally -- single source of truth, not
      # a second copy of these checks that could drift out of sync.
      - name: reconcile.py (spec diff + build/clippy/test/audit gate)
        run: python3 reconcile.py

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Recreate Android SDK dir
        # free-disk-space's `android: true` deletes /usr/local/lib/android
        # to reclaim space, but setup-android below recreates it as the
        # unprivileged runner user -- the preinstalled copy only worked
        # because the runner image pre-chowned it; recreate + chown here
        # so that still works after the deletion.
        run: |
          sudo mkdir -p /usr/local/lib/android
          sudo chown -R "$(id -u):$(id -g)" /usr/local/lib/android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Cross-compile crate for Android
        # arm64-v8a only -- this release APK targets the real test device
        # (LG V40), same reasoning as tetron-mobile's own release build;
        # x86_64-emulator testing is done from local builds, not this CI
        # artifact.
        run: cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build

      - name: Build host library for UniFFI bindgen
        # uniffi-bindgen only reads the library's exported metadata to
        # generate Kotlin bindings -- it does not need to run on-device,
        # so a plain host build (not the Android cross-compiled one) is
        # enough, and simpler than pointing bindgen at the NDK-linked .so.
        run: cargo build --features uniffi/cli

      - name: Regenerate UniFFI Kotlin bindings
        run: |
          cargo run --bin uniffi-bindgen --features uniffi/cli -- \
            generate --library target/debug/libtetron_mobile_sync.so \
            --language kotlin --out-dir android/app/src/main/java

      - name: Decode release keystore
        # Deliberately the same keystore as tetron-mobile (see
        # DO-NOT-COMMIT/release-signing/README.md) -- without this, every
        # run signs with a fresh random debug key (this runner is
        # ephemeral, nothing persists ~/.android/debug.keystore between
        # runs), and a real user installing a newer release APK over an
        # older one would hit a signature mismatch and be forced to
        # uninstall first, wiping their app data. Decodes to a
        # runner-local temp file, never committed/logged.
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Set app version from tag
        # build.gradle.kts reads this to set versionName, so the in-app
        # version actually matches the tag this build came from instead
        # of a stale hardcoded string.
        run: echo "APP_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
            "android/app/build/outputs/apk/debug/tetron-mobile-sync-android-${{ github.ref_name }}-debug.apk"

      - name: Show disk usage (after build)
        if: always()
        run: df -h

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/tetron-mobile-sync-android-${{ github.ref_name }}-debug.apk
          generate_release_notes: true
          # A debug APK build should never read as "latest" even in this
          # repo's own release list.
          prerelease: true
